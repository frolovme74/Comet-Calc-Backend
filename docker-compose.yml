# minio/minio и minio/mc удалены с Docker Hub — используется форк pgsty (https://github.com/pgsty/minio)
services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: comets-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    volumes:
      - ./media:/media
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/comets;
      mc anonymous set download local/comets;
      mc cp --recursive /media/ local/comets/;
      echo 'Minio готов: http://localhost:9000/comets/';
      "

  postgres:
    image: postgres:16
    container_name: comets-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: comets-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8082:8080"
    depends_on:
      - postgres

volumes:
  minio-data:
  postgres-data:
